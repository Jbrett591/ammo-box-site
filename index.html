<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Ammo Boxes</title>

<style>
.header {
  text-align: center;
  margin-bottom: 30px;
}

html {
  scroll-behavior: smooth;
}

.logo {
  max-width: 1000px;
  height: auto;
  margin-bottom: 10px;
}

.order-header {
  text-align: center;
  margin: -4px auto 28px;
}

.order-header img {
  width: 100%;
  max-width: 720px;
  height: auto;
  display: block;
  margin: auto;
  filter: drop-shadow(0 6px 12px rgba(0,0,0,0.8));
}

body {
  font-family: Arial, sans-serif;
  background: #111;
  color: #eee;
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

h1, h2 {
  text-align: center;
}

.section {
  margin-top: 30px;
}

/* CATEGORY BUTTON GRID ONLY */
.category-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.card {
  background: linear-gradient(145deg, #1a1a1a, #0f0f0f);
  border: 1px solid #2a2a2a;
  color: #ddd;
  padding: 14px 6px;
  text-align: center;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  border-radius: 10px;
  letter-spacing: 0.5px;
  transition: all 0.2s ease;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.05),
    0 3px 6px rgba(0,0,0,0.4);
}

.card:hover {
  border-color: #444;
  transform: translateY(-1px);
}

.card:active {
  transform: scale(0.96);
}

.card.selected {
  background: linear-gradient(145deg, #2b2b2b, #1a1a1a);
  border: 1px solid #4caf50 !important;
  color: #fff;
  box-shadow:
    0 0 0 1px #4caf50,
    0 0 10px rgba(76,175,80,0.4),
    inset 0 1px 0 rgba(255,255,255,0.08);
}

/* COLOR SWATCH GRID ONLY */
.color-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, 50px);
  justify-content: center;
  gap: 12px;
}

.dropdown-input {
  width: 100%;
  padding: 14px;
  background: #1a1a1a;
  color: #eee;
  border: 1px solid #333;
  font-size: 16px;
  border-radius: 6px;
  cursor: pointer;
  box-sizing: border-box;
}

.dropdown-input:focus {
  outline: none;
  border-color: #4caf50;
  box-shadow: 0 0 10px #4caf50;
}

.quantity-input {
  width: 100%;
  padding: 14px;
  background: #1a1a1a;
  color: #eee;
  border: 1px solid #333;
  font-size: 16px;
  border-radius: 6px;
  box-sizing: border-box;
}

.color-swatch {
  width: 50px;
  height: 50px;
  border: 1px solid #333;
  cursor: pointer;
  transition: 0.2s;
  border-radius: 10px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.color-swatch::before {
  content: attr(data-value);
  position: absolute;
  bottom: 58px;
  left: 50%;
  transform: translateX(-50%);
  background: #222;
  color: #fff;
  padding: 5px 8px;
  border-radius: 6px;
  font-size: 12px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: 0.2s;
  z-index: 10;
}

.color-swatch:hover::before {
  opacity: 1;
}

.color-swatch:hover {
  transform: scale(1.08);
}

.color-swatch.light::after {
  color: black;
}

.color-swatch::after {
  content: "✔";
  color: white;
  font-size: 20px;
  opacity: 0;
  transform: scale(0.5);
  transition: 0.2s;
}

.color-swatch.selected::after {
  opacity: 1;
  transform: scale(1);
}

.color-swatch.selected {
  border: 2px solid #4caf50 !important;
  box-shadow: 0 0 10px #4caf50;
}

input,
textarea {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
  font-size: 15px;
}

.contact-input {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
}

button {
  margin-top: 22px;
  width: 100%;
  padding: 16px;
  background:
    linear-gradient(90deg, rgba(255,140,0,0.18), transparent 20%, transparent 80%, rgba(255,140,0,0.18)),
    linear-gradient(145deg, #242424, #0d0d0d);
  color: #f0e6d2;
  border: 1px solid #5a4630;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 900;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.08),
    inset 0 -3px 6px rgba(0,0,0,0.85),
    0 0 14px rgba(255,120,20,0.14),
    0 6px 14px rgba(0,0,0,0.65);

  text-shadow:
    0 1px 0 rgba(255,255,255,0.12),
    0 0 8px rgba(255,140,0,0.25),
    0 3px 5px rgba(0,0,0,0.9);

  transition: all 0.2s ease;
}

button:hover {
  background:
    linear-gradient(90deg, rgba(255,140,0,0.28), transparent 20%, transparent 80%, rgba(255,140,0,0.28)),
    linear-gradient(145deg, #303030, #111);
  border-color: #b87333;
  transform: translateY(-1px);
}

button:active {
  transform: scale(0.98);
}

.remove-button {
  background:
    linear-gradient(145deg, #5b1b1b, #250909);
  color: #fff;
  border: 1px solid #8a2a2a;
  margin-top: 8px;
  padding: 10px;
  font-size: 13px;
  border-radius: 8px;
}

.remove-button:hover {
  background:
    linear-gradient(145deg, #7a2424, #300c0c);
  border-color: #b13a3a;
}

.summary {
  background: #1a1a1a;
  padding: 15px;
  margin-top: 20px;
  border: 1px solid #333;
}

.order-item {
  border-bottom: 1px solid #333;
  padding: 12px 0;
}

.order-item:last-child {
  border-bottom: none;
}

@media (max-width: 600px) {
  .section {
    margin-top: 20px;
  }

  .summary {
    font-size: 14px;
  }

  body {
    padding: 10px;
  }

  .logo {
    max-width: 100%;
  }

  .order-header {
    margin: 4px auto 20px;
  }

  .order-header img {
    max-width: 100%;
  }

  h2 {
    font-size: 18px;
  }

  .category-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }

  .card {
    padding: 14px 4px;
    font-size: 14px;
  }

  .color-grid {
    grid-template-columns: repeat(auto-fit, 44px);
    gap: 8px;
  }

  .color-swatch {
    width: 44px;
    height: 44px;
  }

  .contact-input,
  .dropdown-input,
  .quantity-input {
    font-size: 16px;
  }

  textarea {
    font-size: 16px;
  }

  button {
    font-size: 18px;
    padding: 16px;
  }
}
</style>
</head>

<body>

<div class="header">
  <img src="images/forgebox logo.png" alt="ForgeBox Co." class="logo">

  <div class="order-header">
    <img src="images/order-form-header.png" alt="Custom Ammo Box Order Form">
  </div>
</div>

<!-- CATEGORY -->
<div class="section">
  <h2>1. Select Category</h2>
  <div class="category-grid" id="category">
    <div class="card" data-value="Pistol">Pistol</div>
    <div class="card" data-value="Rifle">Rifle</div>
    <div class="card" data-value="Shotgun">Shotgun</div>
  </div>
</div>

<!-- CALIBER / GAUGE -->
<div class="section">
  <h2 id="caliberTitle">2. Select Caliber</h2>
  <select id="caliberSelect" class="dropdown-input">
    <option value="">Select a category first</option>
  </select>
</div>

<!-- CAPACITY -->
<div class="section">
  <h2>3. Capacity</h2>
  <select id="capacitySelect" class="dropdown-input">
    <option value="">Select a caliber first</option>
  </select>
</div>

<!-- COLORS -->
<div class="section">
  <h2>4. Box Color</h2>
  <div class="color-grid" id="boxColor"></div>

  <h2>5. Text Color</h2>
  <div class="color-grid" id="textColor"></div>
</div>

<!-- QUANTITY -->
<div class="section">
  <h2>6. Quantity</h2>
  <input id="quantity" class="quantity-input" type="number" min="1" value="1">
</div>

<!-- CURRENT BOX SUMMARY -->
<div class="summary">
  <strong>Current Box Configuration:</strong>
  <div id="summaryText">Nothing selected</div>
</div>

<button type="button" onclick="addBoxToOrder()">Add Box to Order</button>

<!-- ORDER CART -->
<div class="summary">
  <strong>Boxes in This Order:</strong>
  <div id="orderList">No boxes added yet</div>
</div>

<!-- NOTES -->
<div class="section">
  <h2>7. Custom Notes</h2>
  <textarea id="notes" name="Custom Notes" style="width:100%; height:80px;"></textarea>
</div>

<!-- CONTACT INFO -->
<div class="section">
  <h2>8. Contact Info</h2>
  <input id="customerName" class="contact-input" type="text" placeholder="Name" required>
  <input id="customerEmail" class="contact-input" type="email" placeholder="Email" required>
  <input id="customerPhone" class="contact-input" type="tel" placeholder="Phone">
</div>

<button type="button" onclick="submitOrder()">Submit Order</button>

const colors = {
  "Black": "#000000",
  "OD Green": "#4b5320",
  "FDE": "#c2b280",
  "Gray": "#888888",
  "White": "#f5f5f5",
  "Red": "#b22222",
  "Blue": "#1f4e79"
};

const selections = {};
const orderItems = [];

// CATEGORY CARD HANDLER
function selectHandler(container, key) {
  container.querySelectorAll(".card").forEach(card => {
    card.onclick = () => {
      container.querySelectorAll(".card").forEach(c => c.classList.remove("selected"));
      card.classList.add("selected");

      selections[key] = card.dataset.value;

      if (key === "category") {
        selections.caliber = "";
        selections.capacity = "";

        loadCalibers();

        document.getElementById("caliberSelect").scrollIntoView({
          behavior: "smooth",
          block: "center"
        });
      }

      updateSummary();
    };
  });
}

// LOAD CALIBERS INTO DROPDOWN
function loadCalibers() {
  const caliberSelect = document.getElementById("caliberSelect");
  const capacitySelect = document.getElementById("capacitySelect");
  const caliberTitle = document.getElementById("caliberTitle");

  caliberSelect.innerHTML = "";
  capacitySelect.innerHTML = "";

  if (selections.category === "Shotgun") {
    caliberTitle.innerText = "2. Select Gauge";
    caliberSelect.innerHTML = `<option value="">Select gauge</option>`;
  } else {
    caliberTitle.innerText = "2. Select Caliber";
    caliberSelect.innerHTML = `<option value="">Select caliber</option>`;
  }

  capacitySelect.innerHTML = `<option value="">Select caliber first</option>`;

  const calibers = Object.keys(products[selections.category] || {});

  calibers.forEach(c => {
    const option = document.createElement("option");
    option.value = c;
    option.textContent = c;
    caliberSelect.appendChild(option);
  });
}

// LOAD CAPACITIES INTO DROPDOWN
function loadCapacity() {
  const capacitySelect = document.getElementById("capacitySelect");
  capacitySelect.innerHTML = `<option value="">Select capacity</option>`;

  if (!selections.category || !selections.caliber) return;

  const caps = products[selections.category][selections.caliber] || [];

  caps.forEach(c => {
    const option = document.createElement("option");
    option.value = c;
    option.textContent = c + " rounds";
    capacitySelect.appendChild(option);
  });
}

// CALIBER DROPDOWN CHANGE
document.getElementById("caliberSelect").addEventListener("change", function() {
  selections.caliber = this.value;
  selections.capacity = "";

  loadCapacity();

  document.getElementById("capacitySelect").scrollIntoView({
    behavior: "smooth",
    block: "center"
  });

  updateSummary();
});

// CAPACITY DROPDOWN CHANGE
document.getElementById("capacitySelect").addEventListener("change", function() {
  selections.capacity = this.value;

  document.getElementById("boxColor").scrollIntoView({
    behavior: "smooth",
    block: "center"
  });

  updateSummary();
});

// LOAD COLORS
function loadColors(id, key) {
  const container = document.getElementById(id);

  Object.entries(colors).forEach(([name, val]) => {
    const div = document.createElement("div");
    div.className = "color-swatch";
    div.style.background = val;
    div.dataset.value = name;
    div.title = name;

    const r = parseInt(val.substr(1,2),16);
    const g = parseInt(val.substr(3,2),16);
    const b = parseInt(val.substr(5,2),16);

    const brightness = (r * 299 + g * 587 + b * 114) / 1000;

    if (brightness > 150) {
      div.classList.add("light");
    }

    div.onclick = () => {
      container.querySelectorAll(".color-swatch")
        .forEach(c => c.classList.remove("selected"));

      div.classList.add("selected");
      selections[key] = name;
      updateSummary();
    };

    container.appendChild(div);
  });
}

// CURRENT BOX SUMMARY
function updateSummary() {
  const quantity = document.getElementById("quantity").value || 1;
  const caliberLabel = selections.category === "Shotgun" ? "Gauge" : "Caliber";

  document.getElementById("summaryText").innerHTML = `
    Category: ${selections.category || "-"}<br>
    ${caliberLabel}: ${selections.caliber || "-"}<br>
    Capacity: ${selections.capacity ? selections.capacity + " rounds" : "-"}<br>
    Box Color: ${selections.boxColor || "-"}<br>
    Text Color: ${selections.textColor || "-"}<br>
    Quantity: ${quantity}
  `;
}

// ADD BOX TO ORDER
function addBoxToOrder() {
  const quantity = parseInt(document.getElementById("quantity").value, 10);

  if (!selections.category || !selections.caliber || !selections.capacity) {
    alert("Please select category, caliber/gauge, and capacity first.");
    return;
  }

  if (!selections.boxColor || !selections.textColor) {
    alert("Please select box color and text color first.");
    return;
  }

  if (!quantity || quantity < 1) {
    alert("Please enter a valid quantity.");
    return;
  }

  orderItems.push({
    quantity: quantity,
    category: selections.category,
    caliber: selections.caliber,
    capacity: selections.capacity,
    boxColor: selections.boxColor,
    textColor: selections.textColor
  });

  updateOrderList();
  resetCurrentBox();

  document.getElementById("orderList").scrollIntoView({
    behavior: "smooth",
    block: "center"
  });
}

// UPDATE ORDER LIST
function updateOrderList() {
  const orderList = document.getElementById("orderList");

  if (orderItems.length === 0) {
    orderList.innerHTML = "No boxes added yet";
    return;
  }

  orderList.innerHTML = orderItems.map((item, index) => `
    <div class="order-item">
      <strong>Box ${index + 1}</strong><br>
      Quantity: ${item.quantity}<br>
      Category: ${item.category}<br>
      ${item.category === "Shotgun" ? "Gauge" : "Caliber"}: ${item.caliber}<br>
      Capacity: ${item.capacity} rounds<br>
      Box Color: ${item.boxColor}<br>
      Text Color: ${item.textColor}<br>
      <button type="button" class="remove-button" onclick="removeBox(${index})">Remove This Box</button>
    </div>
  `).join("");
}

// REMOVE BOX
function removeBox(index) {
  orderItems.splice(index, 1);
  updateOrderList();
}

// RESET CURRENT BOX AFTER ADDING
function resetCurrentBox() {
  selections.category = "";
  selections.caliber = "";
  selections.capacity = "";
  selections.boxColor = "";
  selections.textColor = "";

  document.querySelectorAll(".card").forEach(c => c.classList.remove("selected"));
  document.querySelectorAll(".color-swatch").forEach(c => c.classList.remove("selected"));

  document.getElementById("caliberTitle").innerText = "2. Select Caliber";
  document.getElementById("caliberSelect").innerHTML = `<option value="">Select a category first</option>`;
  document.getElementById("capacitySelect").innerHTML = `<option value="">Select a caliber first</option>`;
  document.getElementById("quantity").value = 1;

  updateSummary();
}

// CREATE ORDER ID
function createOrderId() {
  const now = new Date();
  const datePart = now.getFullYear().toString()
    + String(now.getMonth() + 1).padStart(2, "0")
    + String(now.getDate()).padStart(2, "0");

  const timePart = String(now.getHours()).padStart(2, "0")
    + String(now.getMinutes()).padStart(2, "0")
    + String(now.getSeconds()).padStart(2, "0");

  return "FB-" + datePart + "-" + timePart;
}

// SUBMIT
async function submitOrder() {
  const name = document.getElementById("customerName").value.trim();
  const email = document.getElementById("customerEmail").value.trim();
  const phone = document.getElementById("customerPhone").value.trim();
  const notes = document.getElementById("notes").value.trim();

  if (orderItems.length === 0) {
    alert("Please add at least one box to the order before submitting.");
    return;
  }

  if (!name || !email) {
    alert("Please enter your name and email before submitting.");
    return;
  }

  const orderId = createOrderId();

  const formData = new FormData();
  formData.append("Order ID", orderId);
  formData.append("Customer Name", name);
  formData.append("Customer Email", email);
  formData.append("Phone", phone);
  formData.append("Custom Notes", notes);
  formData.append("Total Box Lines", orderItems.length);
  formData.append("_subject", "New ForgeBox Order");

  orderItems.forEach((item, index) => {
    const boxNumber = index + 1;

    formData.append(`Box ${boxNumber} Quantity`, item.quantity);
    formData.append(`Box ${boxNumber} Category`, item.category);
    formData.append(`Box ${boxNumber} Caliber/Gauge`, item.caliber);
    formData.append(`Box ${boxNumber} Capacity`, item.capacity + " rounds");
    formData.append(`Box ${boxNumber} Box Color`, item.boxColor);
    formData.append(`Box ${boxNumber} Text Color`, item.textColor);
  });

  const response = await fetch("https://formspree.io/f/xjgjjjkq", {
    method: "POST",
    body: formData,
    headers: {
      "Accept": "application/json"
    }
  });

  if (response.ok) {
    alert("Order submitted! We’ll confirm details with you once we have a chance to review your order.");

    document.getElementById("customerName").value = "";
    document.getElementById("customerEmail").value = "";
    document.getElementById("customerPhone").value = "";
    document.getElementById("notes").value = "";

    orderItems.length = 0;
    updateOrderList();
    resetCurrentBox();

  } else {
    alert("Something went wrong. Please try again.");
  }
}

// INIT
selectHandler(document.getElementById("category"), "category");
loadColors("boxColor", "boxColor");
loadColors("textColor", "textColor");

document.getElementById("quantity").addEventListener("input", updateSummary);
</script>
