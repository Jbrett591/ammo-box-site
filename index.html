<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Ammo Boxes</title>

<style>
.header {
  text-align: center;
  margin-bottom: 30px;
}

html {
  scroll-behavior: smooth;
}

.logo {
  max-width: 1000px;
  height: auto;
  margin-bottom: 10px;
}

body {
  font-family: Arial, sans-serif;
  background: #111;
  color: #eee;
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

h1, h2 {
  text-align: center;
}

.section {
  margin-top: 30px;
}

/* CATEGORY BUTTON GRID ONLY */
.category-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.card {
  background: linear-gradient(145deg, #1a1a1a, #0f0f0f);
  border: 1px solid #2a2a2a;
  color: #ddd;
  padding: 14px 6px;
  text-align: center;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  border-radius: 10px;
  letter-spacing: 0.5px;
  transition: all 0.2s ease;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.05),
    0 3px 6px rgba(0,0,0,0.4);
}

.card:hover {
  border-color: #444;
  transform: translateY(-1px);
}

.card:active {
  transform: scale(0.96);
}

.card.selected {
  background: linear-gradient(145deg, #2b2b2b, #1a1a1a);
  border: 1px solid #4caf50 !important;
  color: #fff;
  box-shadow:
    0 0 0 1px #4caf50,
    0 0 10px rgba(76,175,80,0.4),
    inset 0 1px 0 rgba(255,255,255,0.08);
}

/* COLOR SWATCH GRID ONLY */
.color-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, 50px);
  justify-content: center;
  gap: 12px;
}

.dropdown-input {
  width: 100%;
  padding: 14px;
  background: #1a1a1a;
  color: #eee;
  border: 1px solid #333;
  font-size: 16px;
  border-radius: 6px;
  cursor: pointer;
  box-sizing: border-box;
}

.dropdown-input:focus {
  outline: none;
  border-color: #4caf50;
  box-shadow: 0 0 10px #4caf50;
}

.quantity-input {
  width: 100%;
  padding: 14px;
  background: #1a1a1a;
  color: #eee;
  border: 1px solid #333;
  font-size: 16px;
  border-radius: 6px;
  box-sizing: border-box;
}

.color-swatch {
  width: 50px;
  height: 50px;
  border: 1px solid #333;
  cursor: pointer;
  transition: 0.2s;
  border-radius: 10px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.color-swatch::before {
  content: attr(data-value);
  position: absolute;
  bottom: 58px;
  left: 50%;
  transform: translateX(-50%);
  background: #222;
  color: #fff;
  padding: 5px 8px;
  border-radius: 6px;
  font-size: 12px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: 0.2s;
  z-index: 10;
}

.color-swatch:hover::before {
  opacity: 1;
}

.color-swatch:hover {
  transform: scale(1.08);
}

.color-swatch.light::after {
  color: black;
}

.color-swatch::after {
  content: "✔";
  color: white;
  font-size: 20px;
  opacity: 0;
  transform: scale(0.5);
  transition: 0.2s;
}

.color-swatch.selected::after {
  opacity: 1;
  transform: scale(1);
}

.color-swatch.selected {
  border: 2px solid #4caf50 !important;
  box-shadow: 0 0 10px #4caf50;
}

input,
textarea {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
  font-size: 15px;
}

.contact-input {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
}

button {
  margin-top: 20px;
  width: 100%;
  padding: 12px;
  background: #4caf50;
  border: none;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #43a047;
}

.secondary-button {
  background: #2d2d2d;
  color: #eee;
  border: 1px solid #444;
}

.secondary-button:hover {
  background: #3a3a3a;
}

.remove-button {
  background: #7a1f1f;
  color: white;
  margin-top: 8px;
  padding: 8px;
  font-size: 14px;
}

.remove-button:hover {
  background: #9b2929;
}

.summary {
  background: #1a1a1a;
  padding: 15px;
  margin-top: 20px;
  border: 1px solid #333;
}

.order-item {
  border-bottom: 1px solid #333;
  padding: 12px 0;
}

.order-item:last-child {
  border-bottom: none;
}

@media (max-width: 600px) {
  .section {
    margin-top: 20px;
  }

  .summary {
    font-size: 14px;
  }

  body {
    padding: 10px;
  }

  .logo {
    max-width: 100%;
  }

  h2 {
    font-size: 18px;
  }

  .category-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }

  .card {
    padding: 14px 4px;
    font-size: 14px;
  }

  .color-grid {
    grid-template-columns: repeat(auto-fit, 44px);
    gap: 8px;
  }

  .color-swatch {
    width: 44px;
    height: 44px;
  }

  .contact-input,
  .dropdown-input,
  .quantity-input {
    font-size: 16px;
  }

  textarea {
    font-size: 16px;
  }

  button {
    font-size: 18px;
    padding: 16px;
  }
}
</style>
</head>

<body>

<div class="header">
  <img src="images/forgebox logo.png" alt="ForgeBox Co." class="logo">
</div>

<!-- CATEGORY -->
<div class="section">
  <h2>1. Select Category</h2>
  <div class="category-grid" id="category">
    <div class="card" data-value="Pistol">Pistol</div>
    <div class="card" data-value="Rifle">Rifle</div>
    <div class="card" data-value="Shotgun">Shotgun</div>
  </div>
</div>

<!-- CALIBER / GAUGE -->
<div class="section">
  <h2 id="caliberTitle">2. Select Caliber</h2>
  <select id="caliberSelect" class="dropdown-input">
    <option value="">Select a category first</option>
  </select>
</div>

<!-- CAPACITY -->
<div class="section">
  <h2>3. Capacity</h2>
  <select id="capacitySelect" class="dropdown-input">
    <option value="">Select a caliber first</option>
  </select>
</div>

<!-- COLORS -->
<div class="section">
  <h2>4. Box Color</h2>
  <div class="color-grid" id="boxColor"></div>

  <h2>5. Text Color</h2>
  <div class="color-grid" id="textColor"></div>
</div>

<!-- QUANTITY -->
<div class="section">
  <h2>6. Quantity</h2>
  <input id="quantity" class="quantity-input" type="number" min="1" value="1">
</div>
